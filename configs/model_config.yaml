random_forest:
  n_estimators: 200
  max_depth: 15
  min_samples_split: 5
  min_samples_leaf: 2
  class_weight: balanced
  random_state: 42

xgboost:
  n_estimators: 200
  max_depth: 7
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  use_label_encoder: false
  eval_metric: logloss
  random_state: 42

isolation_forest:
  n_estimators: 150
  contamination: 0.1
  max_samples: auto
  random_state: 42

autoencoder:
  input_dim: null          # Set dynamically from data
  hidden_dims: [64, 32, 16, 32, 64]
  latent_dim: 8
  dropout_rate: 0.2
  learning_rate: 0.001
  epochs: 50
  batch_size: 256
  reconstruction_threshold: null  # Auto-computed from validation set

ensemble:
  rf_weight: 0.35
  xgb_weight: 0.35
  if_weight: 0.15
  ae_weight: 0.15
  final_threshold: 0.5
